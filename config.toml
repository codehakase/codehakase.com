baseURL = "https://codehakase.com/"
languageCode = "en-us"
title = "Francis Sunday"
theme = "clean"
enableRobotsTXT = true

[params]
  mainSections = ["blog", "shorts"]
  description = "Francis Sunday is a software engineer at Talstack, leading delivery of its HRIS product in Haskell. Previously worked on cross-border payments in Go at Nala."
  twitter = "@codehakase"

  # Author card shown at the end of every post.
  [params.author]
    name = "Francis Sunday"
    avatar = "/images/dp.jpeg"
    bio = "I'm a software engineer at [Talstack](https://talstack.com?ref=codehakase.com), where I lead delivery of our HRIS product in Haskell and PostgreSQL. Previously, I built cross-border payments systems in Go at [Nala](https://nala.com?ref=codehakase.com)."

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNumbersInTable = true
    style = "xcode"
    tabWidth = 4
    lineNos = false
    noClasses = false

  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2
 
 [markup.goldmark]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]
    

summaryLength = 10
showAllPostsArchive = true


# Canonical feed lives at /blog/index.xml (blog + legacy shorts). The home
# RSS output is dropped so there is a single feed; /index.xml is redirected
# to /blog/index.xml in vercel.json for any existing subscribers.
[outputs]
  home = ["HTML", "llms"]

[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    rel = "alternate"
    noUgly = true

[taxonomies]
   tag = "tags"

[permalinks]
  blog = "/blog/:title"
  shorts = "/shorts/:title"

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
