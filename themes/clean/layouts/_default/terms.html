{{ define "main" }}
<div class="listing">
  <h1 class="page-title">Topics</h1>
  <ul class="post-tags">
    {{ range .Data.Terms.ByCount }}
    <li><a href="{{ .Page.RelPermalink }}" class="post-tag">{{ .Page.Title | lower }} <span class="count">{{ .Count }}</span></a></li>
    {{ end }}
  </ul>
</div>
{{ end }}
