{{ define "main" }}
<div class="listing">
  <h1 class="page-title">Archive</h1>
  {{ $pages := partial "writing.html" . }}
  {{ range ($pages.GroupByDate "2006") }}
  <section class="year-group" aria-labelledby="y{{ .Key }}">
    <h2 id="y{{ .Key }}" class="year-label">{{ .Key }}</h2>
    <ul class="post-list">
      {{ range .Pages }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2" }}</time>
      </li>
      {{ end }}
    </ul>
  </section>
  {{ end }}
</div>
{{ end }}
