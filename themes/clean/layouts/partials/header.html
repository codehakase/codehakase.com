<header class="site-header">

  <div class="site-header-right">

      <a href="/about/">about</a>

      <a href="/blog/">posts</a>
      <span class="sep" aria-hidden="true">/</span>
      <a href="/projects/">projects</a>
    </nav>
    <button type="button" onclick="toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode" class="theme-toggle-btn">
      <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>

    </button>
  </div>
</header>

<script>
function syncThemeColor() {
  var h = document.documentElement;
  var t = h.getAttribute('data-theme');
  document.querySelectorAll('meta[name="theme-color"]').forEach(function(m) {
    if (!m.dataset.media) m.dataset.media = m.getAttribute('media') || '';
    if (t) {
      m.removeAttribute('media');
      m.setAttribute('content', t === 'dark' ? '#1c1b10' : '#fcfbf0');
    } else if (m.dataset.media) {
      m.setAttribute('media', m.dataset.media);
      m.setAttribute('content', m.dataset.media.indexOf('dark') > -1 ? '#1c1b10' : '#fcfbf0');
    }
  });
}
function toggleTheme() {
  var h = document.documentElement;
  var current = h.getAttribute('data-theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  var next = current === 'dark' ? 'light' : 'dark';
  h.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) {}
  syncThemeColor();
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
  var stored = null;
  try { stored = localStorage.getItem('theme'); } catch (e) {}
  if (!stored) {
    document.documentElement.removeAttribute('data-theme');
    syncThemeColor();
  }
});
syncThemeColor();
</script>
